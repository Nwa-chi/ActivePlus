version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - env | grep -e SESSION_SECRET -e TWILIO_ -e MAPBOX_ACCESS_TOKEN -e STRIPE_ -e ADMIN_EMAILS -e ACTIVEPLUS_TABLE_NAME -e APP_URL -e COGNITO_ -e AWS_REGION >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
